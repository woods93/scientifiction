const pages={
aleph:()=>`<img class="hero" src="${U(D.patch)}" alt="Scientifiction Institute crest"><h1>The Amazing Stories of Corky Taylor</h1><p class="lede">What makes an American Legend? Why are some heroes remembered and others forgotten, and some stories become mythologized into our shared experience, while others blur into the background detritus? <em>The Amazing Stories of Corky Taylor</em> will explore how the journey one person experiences both reaches into the Verisimilitude of the past and illustrates the resonant kaleidoscope of connections that connect and bind our shared human experience.</p><p>Release date and listening links will be posted here and on <a href="#radio-free-sloth">Radio Free Sloth</a>.</p>`,
beit:()=>`<h1>Beit</h1><p>As the 1920s crashed into the 1930s, great changes were afoot in Henderson, KY. Prohibition had ended. FDR shuts up the ill-health naysayers (thanks Bernarr, and <em>Liberty</em> magazine) on the way to being sworn in as president, and someone, or some people, be they mobsters, crooked labor union thugs, some Arkansas Traveller, or some other nefarious slickers, threatened to kidnap Henry Kraver’s grandson, Roy “Sonny” Taylor, Jr.</p><p>So, Henry sent “Sonny” down to Castle Heights Military Academy* for safe keeping. “Sonny” ended up in Gen. George S. Patton’s inner circle after charging a machine gun nest, earning a Bronze Star and a Purple Heart in the process. And we shall refer to Roy as “Ace” now, the nickname bestowed on him by the General himself. Patton also gave Ace his beloved, custom sidearm, a Colt army issued 1911 .45 pistol. Then Patton died. Ace went to Hawaii to command the 35th. And Corky learned to surf.</p><p><small>*Henry Kraver died four years later, a victim of injuries sustained after a suspicious “fall” (off the mezzanine, down the stairs?) at the Palmer House Hotel in Chicago, IL. Sixty three thousand barrels and countless bottles of prohibition whiskey later.</small></p><p>Ace fought in Korea and was wounded-in-action (again), was the first officer on the ground in Vietnam, and planned a Bay of Pigs invasion with General Westmoreland. Corky absorbed the art of surfing from Paoa “Duke” Kahanamoku, shlepped golf clubs for General Westmoreland, and earned his own stripes at Castle Heights Military Academy while rooming with Gregg Allman (we don’t talk about Al Gore). Then, after schlepping out of a macher deal on the 50th floor at Rockefeller Center (not Pan Am, mind you), he resurrected Henry’s distillery (DSP-KY-50) and wound up in the Bourbon Hall of Fame.</p><figure><img src="${U(D.beit)}" alt="Macfadden postcard"></figure>`,
gimel:()=>`<h1>Gimel</h1><blockquote><p>I interpret the story as being real. I mean, I just accept, for the story purposes, that everything is true.</p><cite>— Stanley Kubrick</cite></blockquote><h2>scientifiction <small>(<a href="https://en.wiktionary.org/wiki/Appendix:Glossary#uncountable">uncountable</a>)</small></h2><ol><li>(<a href="https://en.wiktionary.org/wiki/Appendix:Glossary#dated">dated</a>) <a href="https://en.wiktionary.org/wiki/science_fiction#English">science fiction</a>. Early item of <a href="https://sf-encyclopedia.com/entry/terminology">Terminology</a> coined by Hugo <a href="https://sf-encyclopedia.com/entry/gernsback_hugo">Gernsback</a> as a contraction of “scientific fiction” and thus defined by him in the first issue of <a href="https://sf-encyclopedia.com/entry/amazing">Amazing Stories</a> in April 1926 (see <a href="https://sf-encyclopedia.com/entry/definitions_of_sf">Definitions of SF</a>). Gernsback dated his original coinage of the word to 1915, most probably referring to its appearance (in italics) in the opening paragraph of “Thought Transmission on Mars” (January 1916 <em>Electrical Experimenter</em>), the eighth episode of his <em>Baron Muenchhausen’s Scientific Adventures</em> sequence. In 1924 he had solicited manuscripts for a proposed sf magazine to be titled <em>Scientifiction</em>, but this never appeared.</li></ol><p>“Scientifiction” – variously abbreviated as stf or stef – never became a very popular term, and within a decade of its 1926 relaunch was largely replaced by “science fiction”. If used at all by later commentators, it generally refers to the awkward, <a href="https://sf-encyclopedia.com/entry/technology">Technology</a>-oriented fiction published by Gernsback or, disparagingly, to modern equivalents. However, in his preface to <em>The Great Divorce: A Dream</em> (1945 chap) C S <a href="https://sf-encyclopedia.com/entry/lewis_c_s">Lewis</a> cites – without disparagement – a story “read several years ago in a highly coloured American magazine of what they call ‘Scientifiction’.” Later attempts to re-establish the term in a positive sense have failed. [DRL/PN]</p><h3>Derived terms</h3><ul><li><a href="https://en.wiktionary.org/wiki/scientifictional#English">scientifictional</a></li><li><a href="https://en.wiktionary.org/wiki/stf#English">stf</a></li></ul><h3>See also</h3><ul><li><a href="https://en.wiktionary.org/wiki/speculative_fiction#English">documentary</a></li><li><a href="https://en.wiktionary.org/wiki/speculative_fiction#English">speculative fiction</a></li></ul><h3>Pronunciation</h3><ul><li><a href="https://en.wiktionary.org/wiki/Wiktionary:International_Phonetic_Alphabet">IPA</a>(<a href="https://en.wiktionary.org/wiki/Appendix:English_pronunciation">key</a>): /ˌsaɪ.ən.tɪˈfɪk.ʃən/</li></ul><hr><blockquote><p>Don’t forget, you don’t know I’m here at all. No word of that fact is to be mentioned in any letters. The world is not supposed to know what the hell they did with me. I’m not supposed to be commanding this army. I’m not even supposed to be in England. Let the first bastards to find out be the goddamned Germans. Some day, I want them to rise up on their piss-soaked hind legs and howl ‘Ach! It’s the goddamned Third Army and that son-of-a-bitch Patton again!’</p><p>Then there’s one thing you men will be able to say when this war is over and you get back home. Thirty years from now when you’re sitting by your fireside with your grandson on your knee and he asks, ‘What did you do in the great World War Two?’ You won’t have to cough and say, ‘Well, your granddaddy shoveled shit in Louisiana.’ No sir, you can look him straight in the eye and say ‘Son, your granddaddy rode with the great Third Army and a son-of-a-goddamned-bitch named George Patton!’</p><cite>— Gen. George S. Patton</cite></blockquote>${D.gimel.map(p=>`<figure><img src="${U(p)}" alt="${nice(p)}"></figure>`).join('')}`,
dalet:()=>`<h1>Dalet</h1><p class="lede">Sources and ephemera.</p>${gallery(D.dalet,'dalet')}`,
hei:()=>`<h1>The Holy Books and Scriptures</h1><p class="lede">Working title. Ranked from the most illuminated gnostica on down, straight from Sophia. Badges to come.</p><ol class="books">${books.map(b=>`<li>${b.img?`<img class="th" src="${b.img}" alt="${b.t} cover">`:'<span class="th"></span>'}<span><span class="bt">${b.u?`<a href="${b.u}" target="_blank" rel="noopener">${b.t}</a>`:b.t}</span> <span class="ba">${b.a||''}</span></span></li>`).join('')}</ol>`,
vev:()=>`<h1>Chutzpah</h1><p class="lede">Portraits and documents.</p>${gallery(D.vev,'vev')}`,
zayin:()=>`<h1>Zayin</h1><p class="lede">The archive: newspapers, letters, photographs, and advertisements.</p>${gallery(D.zayin,'zayin')}`,
'radio-free-sloth':()=>`<h1>Radio Free Sloth</h1><p class="lede">The podcast, the channel, and the conversation that grows out of the Institute’s work.</p><div class="card"><h2 style="margin-top:0">Listen &amp; watch</h2><p><a href="https://www.youtube.com/channel/UCB9iVQs8hPSQ7516IbsZZ0w">The Scientifiction Institute on YouTube</a></p><p>Podcast feed and Substack links will be added here when they are ready.</p></div><div class="card"><h2 style="margin-top:0">Ask the Institute</h2><p>A chat assistant and reader questions will live here.</p></div>`
};
